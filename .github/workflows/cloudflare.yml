# Publish the website (the converter running in the browser) to Cloudflare Pages
# on every push to main: https://convertpdf.pages.dev
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  shown on the Workers & Pages page of the dashboard
# The Pages project (named as PROJECT below) is made by the first run if it isn't there.

name: Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# one deployment at a time; a newer push replaces one that is waiting
concurrency:
  group: cloudflare
  cancel-in-progress: true

env:
  PROJECT: convertpdf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # the Pages project is made the first time (it's there already: nothing to do)
      - name: Make the Pages project if there isn't one
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@3 pages project list | grep -qw "$PROJECT"; then
            echo "The project $PROJECT is there."
          else
            npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main
          fi
      # wrangler run as it is (not installed in the project, whose own packages it could clash with)
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
